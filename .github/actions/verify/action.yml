name: Verify packages
description: Non-publishing checks shared by pull requests and tag releases
runs:
  using: composite
  steps:
    - name: Check release workflow contracts
      shell: bash
      run: pnpm run test:workflows

    - name: Build
      shell: bash
      run: pnpm run build

    - name: Test public type contracts
      shell: bash
      run: pnpm run test:types

    - name: Check packed Svelte adapter
      shell: bash
      run: pnpm exec node scripts/test-svelte-package.mjs

    - name: Check packed package entry contracts
      shell: bash
      run: pnpm exec node scripts/test-package-entries.mjs

    - name: Test
      shell: bash
      run: pnpm run test
