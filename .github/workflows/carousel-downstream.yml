name: Carousel packed downstream observation

# One observation for the next PR131 update. Do not repeat until green.
on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  observe:
    if: >-
      github.event.pull_request.number == 131
      && github.event.before == '812fbea3953d4c17959ef4239df7049c15db1c30'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact core head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Checkout unchanged UI reproducer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: destyler/ui
          ref: ad7aca3ce9a19fd840cba9ade3fe1c17aa46a259
          path: downstream/ui
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2

      - name: Build, pack and observe once
        timeout-minutes: 20
        env:
          EXPECTED_CORE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -e -o pipefail
          evidence="$GITHUB_WORKSPACE/downstream/artifacts"
          consumer="$GITHUB_WORKSPACE/downstream/ui"
          mkdir -p "$evidence/extracted"
          {
            test "$(git rev-parse HEAD)" = "$EXPECTED_CORE_SHA"
            core_pnpm() { npm exec --yes --package=pnpm@10.26.1 -- pnpm "$@"; }
            ui_pnpm() { (cd "$consumer" && npm exec --yes --package=pnpm@10.28.0 -- pnpm "$@"); }
            test "$(core_pnpm --version)" = 10.26.1
            test "$(ui_pnpm --version)" = 10.28.0
            core_pnpm install --frozen-lockfile
            core_pnpm --filter @destyler/carousel... build
            core_pnpm --dir packages/components/carousel pack --pack-destination "$evidence"
            tarball="$evidence/destyler-carousel-0.2.7.tgz"
            tar -xzf "$tarball" -C "$evidence/extracted"
            git diff --exit-code HEAD
            ui_pnpm install --frozen-lockfile
            node scripts/verify-carousel-consumer.mjs prepare "$consumer" "$tarball" "$evidence/extracted/package" "$evidence"
            # This second lock is disposable test input, not the release lock.
            ui_pnpm install --no-frozen-lockfile --prefer-offline
            node scripts/verify-carousel-consumer.mjs verify "$consumer" "$tarball" "$evidence/extracted/package" "$evidence"
            ui_pnpm exec playwright install --with-deps chromium
            ui_pnpm run svelte:sync
            ui_pnpm exec vitest run --project svelte packages/svelte/tests/migration/binding-contract.test.ts --browser.headless --no-file-parallelism
          } 2>&1 | tee "$evidence/observation.log"

      - name: Preserve package, provenance, logs and failure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carousel-downstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            downstream/artifacts/
            downstream/ui/packages/svelte/tests/migration/__screenshots__/**
          if-no-files-found: warn
          retention-days: 7
