name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    name: 'Verify Release: node-${{ matrix.node }}'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.node == 24
        run: pnpm run lint

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps

      - name: Verify packages
        uses: ./.github/actions/verify

  release:
    needs: verify
    runs-on: ubuntu-latest
    name: Release Package
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm
        run: npm i -g npm@latest
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Publish to NPM
        run: pnpm run publish:ci
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  changelog:
    needs: verify
    runs-on: ubuntu-latest
    name: Generate Changelog
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    name: Deploy Release Page
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm run build

      - name: Build Document
        run: pnpm run docs:build

      - name: Zip destyler.org
        run: npx tsx scripts/zip.ts document/dist docs-dist

      - name: Deploy destyler.org
        run: npx tsx scripts/deploy.ts ${TOKEN} ${ENV} ${SERVICE} docs-dist.zip
        env:
          TOKEN: ${{secrets.ZEABUR_TOKEN}}
          ENV: ${{secrets.DESTYLER_ENV}}
          SERVICE: ${{secrets.DESTYLER_ORG}}

      - name: Build Storybook
        run: pnpm run storybook:build

      - name: Zip storybook.destyler.org
        run: npx tsx scripts/zip.ts storybook/dist storybook-dist

      - name: Deploy storybook.destyler.org
        run: npx tsx scripts/deploy.ts ${TOKEN} ${ENV} ${SERVICE} storybook-dist.zip
        env:
          TOKEN: ${{secrets.ZEABUR_TOKEN}}
          ENV: ${{secrets.DESTYLER_ENV}}
          SERVICE: ${{secrets.STORYBOOK_ORG}}
