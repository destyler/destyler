name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    name: 'Verify Release: node-${{ matrix.node }}'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.3, 24]
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.node == 24
        run: pnpm run lint

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps

      - name: Verify packages
        uses: ./.github/actions/verify

  node20-consumer:
    runs-on: ubuntu-latest
    name: 'Packed consumers: node-20.19.0'
    permissions:
      contents: read
    steps:
      - name: Checkout consumer source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/
      - name: Verify Node 20 consumers
        uses: ./.github/actions/verify-node20-consumers

  release:
    needs: [verify, node20-consumer]
    runs-on: ubuntu-latest
    name: Release Package
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm
        run: npm i -g npm@latest
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Publish to NPM
        run: pnpm run publish:ci
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  changelog:
    needs: [verify, node20-consumer]
    runs-on: ubuntu-latest
    name: Generate Changelog
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  deploy:
    needs: [verify, node20-consumer]
    runs-on: ubuntu-latest
    name: Deploy Release Page
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm run build

      - name: Build Document
        run: pnpm run docs:build

      - name: Deploy destyler.org to Vercel
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_DOCS_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_DOCS_TOKEN }}
        run: |
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_DOCS_PROJECT_ID}"
          : "${VERCEL_TOKEN:?Missing VERCEL_DOCS_TOKEN}"
          deployment_dir=$(mktemp -d)
          trap 'rm -rf "$deployment_dir"' EXIT
          mkdir -p "$deployment_dir/.vercel/output"
          cp -R document/dist "$deployment_dir/.vercel/output/static"
          printf '%s\n' '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/.*","dest":"/404.html","status":404}]}' > "$deployment_dir/.vercel/output/config.json"
          npx --yes vercel@64.5.0 deploy --cwd "$deployment_dir" --prebuilt --prod --archive=tgz --yes --token "$VERCEL_TOKEN"

      - name: Build Storybook
        run: pnpm run storybook:build

      - name: Deploy storybook.destyler.org to Vercel
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_STORYBOOK_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_STORYBOOK_TOKEN }}
        run: |
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_STORYBOOK_PROJECT_ID}"
          : "${VERCEL_TOKEN:?Missing VERCEL_STORYBOOK_TOKEN}"
          deployment_dir=$(mktemp -d)
          trap 'rm -rf "$deployment_dir"' EXIT
          mkdir -p "$deployment_dir/.vercel/output"
          cp -R storybook/dist "$deployment_dir/.vercel/output/static"
          printf '%s\n' '{"version":3}' > "$deployment_dir/.vercel/output/config.json"
          npx --yes vercel@64.5.0 deploy --cwd "$deployment_dir" --prebuilt --prod --archive=tgz --yes --token "$VERCEL_TOKEN"
