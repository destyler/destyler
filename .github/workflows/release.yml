name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    name: 'Verify Release: node-${{ matrix.node }}'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.3, 24]
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.node == 24
        run: pnpm run lint

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps

      - name: Verify packages
        uses: ./.github/actions/verify

  supported-consumer:
    runs-on: ubuntu-latest
    name: 'Packed consumers: node-22.22.3'
    permissions:
      contents: read
    steps:
      - name: Checkout consumer source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/
      - name: Verify Node 22.22.3 consumers
        uses: ./.github/actions/verify-supported-consumers

  release:
    needs: [verify, supported-consumer]
    runs-on: ubuntu-latest
    name: Release Package
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm
        run: npm i -g npm@latest
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Build packages
        run: pnpm run --filter "./packages/**" -r build

      - name: Check public type declarations
        run: pnpm run check:declarations

      - name: Publish to NPM
        run: pnpm run publish:ci
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  changelog:
    needs: [verify, supported-consumer]
    runs-on: ubuntu-latest
    name: Generate Changelog
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  deploy:
    needs: [verify, supported-consumer]
    runs-on: ubuntu-latest
    name: Deploy Release Page
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm run build

      - name: Build Document
        run: pnpm run docs:build

      - name: Build Storybook
        run: pnpm run storybook:build

  promote-websites:
    needs: [verify, supported-consumer, deploy]
    runs-on: ubuntu-latest
    name: Update Vercel Production Branch
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Publish verified release to Vercel
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== 'push' || !context.ref.startsWith('refs/tags/v')) {
              throw new Error('Production websites require a version tag push')
            }
            const ref = 'heads/vercel-production'
            const sha = context.sha
            let current
            try {
              current = await github.rest.git.getRef({ ...context.repo, ref })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha })
              return
            }
            if (current.data.object.sha === sha) {
              core.info('The production branch already points to this release')
              return
            }
            await github.rest.git.updateRef({ ...context.repo, ref, sha, force: false })
