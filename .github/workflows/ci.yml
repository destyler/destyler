name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: 'Test: node-${{ matrix.node }}'
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.3, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps

      - name: Verify packages
        uses: ./.github/actions/verify

      - name: Report Coverage
        if: always() && matrix.node == 24
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./html/coverage/coverage-summary.json
          json-final-path: ./html/coverage/coverage-final.json

  node20-consumer:
    runs-on: ubuntu-latest
    name: 'Packed consumers: node-20.19.0'
    permissions:
      contents: read
    steps:
      - name: Checkout consumer source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/
      - name: Verify Node 20 consumers
        uses: ./.github/actions/verify-node20-consumers
