name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: 'Test: node-${{ matrix.node }}'
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps

      - name: Verify packages
        uses: ./.github/actions/verify

      - name: Observe temporary UnoCSS native comparison
        if: matrix.node == 22
        run: >-
          pnpm exec node scripts/observe-unocss-native.mjs
          --baseline 6e5c746f6d9ab545b09cd72c530fe567b14106a5
          --candidate "$(git rev-parse HEAD)"
          --output "$RUNNER_TEMP/core-unocss-native-evidence"

      - name: Upload temporary UnoCSS native evidence
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v6
        with:
          name: core-unocss-native-evidence
          path: ${{ runner.temp }}/core-unocss-native-evidence
          if-no-files-found: error

      - name: Report Coverage
        if: always() && matrix.node == 24
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./html/coverage/coverage-summary.json
          json-final-path: ./html/coverage/coverage-final.json
